version: '3.8'

services:
  secure-app:
    build:
      context: .
      dockerfile: Dockerfile.secure
    container_name: secure-container
    ports:
      - "5001:5000"

    # Security: Drop ALL capabilities and only add what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only if binding to privileged ports

    # Security: Run as non-root user
    user: "1000:1000"

    # Security: Read-only root filesystem
    read_only: true

    # Security: Temporary filesystems for writable areas
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
      - /run:noexec,nosuid,size=50m

    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 128M

    # Security: Security options
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
      - seccomp:default

    # Security: Network isolation
    networks:
      - secure-network

    # Security: Environment variables
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

    # Security: No privileged access
    privileged: false

    # Security: Disable inter-container communication
    ipc: none

    # Security: Limited restart policy
    restart: "no"

    # Security: Labels for identification
    labels:
      - "security.hardened=true"
      - "purpose=secure-demo"
      - "capabilities=minimal"

    # Security: Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  secure-network:
    driver: bridge
    internal: true  # No external network access
    labels:
      - "security.isolated=true"
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
